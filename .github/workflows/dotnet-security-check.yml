name: .NET Security Check

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 9 * * 1'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: NuGet audit
        run: dotnet list NooksApi.sln package --vulnerable --include-transitive || true

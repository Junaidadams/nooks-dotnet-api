services:
  api:
    image: ghcr.io/you/minimal-api:latest
    container_name: minimal-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ProxyOptions__KnownProxies__0: ${ProxyOptions__KnownProxies__0:-}
    networks:
      - tunnel-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  postgres:
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d minimal_api" ]
      interval: 5s
      retries: 5
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

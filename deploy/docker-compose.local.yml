services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: nooks-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: nooks_api
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - nooks_local_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nooks_api"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: nooks-mailpit-local
    restart: unless-stopped
    ports:
      - "8025:8025"   # Mailpit web UI
      - "1025:1025"   # SMTP port
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8025/api/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  nooks_local_pgdata:
